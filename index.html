<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Güvenli Doğal Gaz Kullanımı - Mini Oyunlar</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #f7f4ea;
      overflow: hidden;
      overscroll-behavior: none;
    }

    #game-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #f7f4ea;
      overflow: hidden;
      touch-action: none;
    }

    #game-container canvas {
      display: block;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      image-rendering: auto;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
